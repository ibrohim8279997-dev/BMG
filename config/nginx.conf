# BMG edge proxy: browser -> nginx (TLS) -> Next.js :3000 -> Django 127.0.0.1:8000.
# Next.js keeps an incoming X-Forwarded-For as is, so the edge MUST overwrite (not append) the forwarding headers:
# otherwise a client picks the IP that Django uses for rate limits and the admin / Click / CRM allowlists.
# Django: NUM_PROXIES=1, TRUSTED_PROXY_IPS=<Next.js host, 127.0.0.1 when on the same machine>,
# gunicorn bound to 127.0.0.1:8000 only (never exposed publicly).

server {
    listen 80;
    server_name bmg.example.uz;
    return 301 https://$host$request_uri;          # HTTPS redirect at the edge
}

server {
    listen 443 ssl;
    http2 on;
    server_name bmg.example.uz;
    ssl_certificate     /etc/letsencrypt/live/bmg.example.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bmg.example.uz/privkey.pem;
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;   # overwrite: the client's own value is discarded
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;        # overwrite: a client cannot claim https
        proxy_set_header X-Forwarded-Host  $host;
    }

    # the separate Telegram bot talks to Django directly on the private side; never expose /api/v1/bot/ here
    location /api/v1/bot/ { return 404; }
}
